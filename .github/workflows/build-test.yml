name: Build and Test Lamsza

on:
  push:
  pull_request:

# Two jobs, not one. When this was a single job a frontend failure marked the Go
# steps "skipped", so the backend went unbuilt and untested for hours without the
# summary saying so. Separate jobs always report separately.
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: the test suite uses the node:test runner features that
      # landed after 20 and will not parse on it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Test Svelte frontend
        run: npm test

      # build:no-preflight, not build. `npm run build` runs scripts/preflight-api.js,
      # which refuses to build when no Go backend answers on 3001. That gate is for
      # cutting releases on a live stack; there is no backend in CI, and dist/ comes
      # out the same either way because component fetches are gated on canReachApi().
      - name: Build Svelte frontend
        run: npm run build:no-preflight

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The root `backend` package is a database integration suite:
    # handlers_test.go's init() calls db.InitDB(), and the tests read and write
    # entries/websites/users. A bare Postgres is not enough on its own - the
    # app's Migrate() calls add to the schema, they do not create those base
    # tables - so the bootstrap step below loads the committed schema first.
    # Postgres 16 and port 5433 match local dev.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lamsza_user
          POSTGRES_PASSWORD: lamsza_password
          POSTGRES_DB: lamsza
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lamsza_user -d lamsza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lamsza_user:lamsza_password@localhost:5433/lamsza?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      # Same script and same committed schema a developer uses to create a
      # fresh local database - not a CI-only fork of the schema. It fails the
      # job if the reference rows did not load, because the suites skip rather
      # than fail when settlements is empty, and a skipped test looks green.
      - name: Bootstrap the database
        # The runner image ships psql, and the script says so plainly when it is
        # missing rather than guessing - but a missing client would fail the job
        # for a reason that has nothing to do with the code, so install it if it
        # ever stops being there. No-op on a runner that already has it.
        run: |
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
          ../scripts/db-bootstrap.sh

      # Every package, no exclusions (BOG-53).
      - name: Test Go backend
        run: go test -count=1 ./...

      - name: Build Go backend
        run: go build -o /tmp/sz-gugel-bin main.go
