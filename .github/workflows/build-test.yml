name: Build and Test Lamsza

on:
  push:
  pull_request:

# Two jobs, not one. When this was a single job a frontend failure marked the Go
# steps "skipped", so the backend went unbuilt and untested for hours without the
# summary saying so. Separate jobs always report separately.
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The receiver below has no other gate, and it is the one script whose
      # failure is self-concealing: if ci-status-issue.sh breaks, the only symptom
      # is the ci-status job going red on `main`, and the thing that reports a red
      # `main` is that same script. So it is tested inside a job somebody watches.
      # It lives in `frontend` rather than `backend` because the latter runs
      # everything from backend/. Hermetic: fakes `gh`, no network, needs only jq,
      # which is on the runner image. Takes under a second.
      - name: Test the CI status receiver
        run: bash .github/ci-status-issue.test.sh

      # 22, not 20: the test suite uses the node:test runner features that
      # landed after 20 and will not parse on it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Test Svelte frontend
        run: npm test

      # build:no-preflight, not build. `npm run build` runs scripts/preflight-api.js,
      # which refuses to build when no Go backend answers on 3001. That gate is for
      # cutting releases on a live stack; there is no backend in CI, and dist/ comes
      # out the same either way because component fetches are gated on canReachApi().
      - name: Build Svelte frontend
        run: npm run build:no-preflight

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The root `backend` package is a database integration suite:
    # handlers_test.go's init() calls db.InitDB(), and the tests read and write
    # entries/websites/users. A bare Postgres is not enough on its own - the
    # app's Migrate() calls add to the schema, they do not create those base
    # tables - so the bootstrap step below loads the committed schema first.
    # Postgres 16 and port 5433 match local dev.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lamsza_user
          POSTGRES_PASSWORD: lamsza_password
          POSTGRES_DB: lamsza
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lamsza_user -d lamsza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lamsza_user:lamsza_password@localhost:5433/lamsza?sslmode=disable
      # The suites read only TEST_DATABASE_URL (backend/internal/db/testguard.go).
      # Here it is the throwaway service database above.
      TEST_DATABASE_URL: postgres://lamsza_user:lamsza_password@localhost:5433/lamsza?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      # Same script and same committed schema a developer uses to create a
      # fresh local database - not a CI-only fork of the schema. It fails the
      # job if the reference rows did not load, because the suites skip rather
      # than fail when settlements is empty, and a skipped test looks green.
      - name: Bootstrap the database
        # The runner image ships psql, and the script says so plainly when it is
        # missing rather than guessing - but a missing client would fail the job
        # for a reason that has nothing to do with the code, so install it if it
        # ever stops being there. No-op on a runner that already has it.
        run: |
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
          ../scripts/db-bootstrap.sh

      # Every package, no exclusions (BOG-53).
      - name: Test Go backend
        run: go test -count=1 ./...

      - name: Build Go backend
        run: go build -o /tmp/sz-gugel-bin main.go

  # The receiver. A red CI is only a gate if it reaches a person, and nothing on
  # the dev machine can read Actions: no `gh` CLI, git auth is SSH-key only, the
  # unauthenticated api.github.com limit for that IP is spent, and two of the four
  # repos are private. So the signal is pushed from in here, into one GitHub issue
  # that closes itself when main goes green. Decided on BOG-54; see R7 in lamsza's
  # docs/network/WAYS_OF_WORKING.md.
  #
  # Pushes to `main` only: a pull request shows its own checks, and a feature
  # branch being red mid-work is normal and must not notify anyone. `always()` so
  # it still runs after a failed job, and the third clause keeps a cancelled or
  # skipped run from being reported as a failure.
  ci-status:
    needs: [frontend, backend]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && (needs.frontend.result == 'failure' || needs.backend.result == 'failure'
      || (needs.frontend.result == 'success' && needs.backend.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open, update or close the "CI is red on main" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_FRONTEND: ${{ needs.frontend.result }}
          CI_BACKEND: ${{ needs.backend.result }}
          CI_SHA: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/ci-status-issue.sh
