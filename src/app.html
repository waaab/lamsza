<!doctype html>
<html lang="hu">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- No <title> here: every page sets its own in <svelte:head>, and a second
	     one here made two <title> tags on every page. -->
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<meta name="description"
		content="Lámsza - gyors keresés, időjárás, hírek és gyorslinkek Székelyföldön és Erdélyben. Na lámsza, kicsibaratom!" />
	<!--
		Keep this as an external file, not an inline block: the
		Content-Security-Policy in svelte.config.js allows scripts from this
		origin only. It must stay synchronous and before the body so the theme is
		set before the first paint.
	-->
	<script src="%sveltekit.assets%/theme-init.js"></script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
